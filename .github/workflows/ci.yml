name: MCP portability
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s test -p "*_test.py"
      - run: javac -encoding UTF-8 -d client-mod/build/parser-test client-mod/src/main/java/dev/blockcontext/client/MenuParser.java client-mod/src/test/java/dev/blockcontext/client/MenuParserTest.java
      - run: java -ea -classpath client-mod/build/parser-test dev.blockcontext.client.MenuParserTest
