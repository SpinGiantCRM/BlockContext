name: MCP portability
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: javac -encoding UTF-8 -d client-mod/build/parser-test client-mod/src/main/java/dev/blockcontext/client/MenuParser.java client-mod/src/main/java/dev/blockcontext/client/ItemFacts.java client-mod/src/main/java/dev/blockcontext/client/ObservationChanges.java client-mod/src/main/java/dev/blockcontext/client/CommissionTracker.java client-mod/src/main/java/dev/blockcontext/client/CommissionLedgerFile.java client-mod/src/test/java/dev/blockcontext/client/MenuParserTest.java
      - run: java -ea -classpath client-mod/build/parser-test dev.blockcontext.client.MenuParserTest
